# Run Breezel with a single command:
#
#   docker compose up -d --build
#
# Then open http://localhost:8080
#
# Change the host port by setting BREEZEL_PORT, e.g.:
#   BREEZEL_PORT=3000 docker compose up -d --build
#
# Projects are stored in the "breezel-data" volume and survive rebuilds.

services:
  breezel:
    build: .
    image: breezel:latest
    container_name: breezel
    ports:
      - "${BREEZEL_PORT:-${APPSHOTS_PORT:-8080}}:80"
    volumes:
      - breezel-data:/data
    # Require a password (recommended if the port is reachable beyond your LAN):
    # environment:
    #   BREEZEL_PASSWORD: change-me
    restart: unless-stopped

volumes:
  breezel-data:
