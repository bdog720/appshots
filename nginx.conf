# nginx config for the appshots single-page app.
# Installed at /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets on the fly.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Fingerprinted build assets (Vite emits content-hashed filenames) can be
    # cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Never cache the HTML entry point, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (TanStack Router uses browser history): serve
    # index.html for any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
